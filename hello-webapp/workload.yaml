apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: hello-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: hello-world-webapp436512-hello-api
      name: http
      visibility: project
      envBindings:
        address: HELLO_API_URL
  resources:
    - ref: hello-world-webap-0e9ba8b6
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
